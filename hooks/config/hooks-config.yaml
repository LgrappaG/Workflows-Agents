  # GATE 7: Token Efficiency
  file_size:
    min_bytes: 600
    max_bytes: 1200
    phase_5_enriched_max: 1500
    phase_6_experimental_max: 2000
    token_estimate_divisor: 4  # ~1 token per 4 characters

  # Workflow-specific Gates
  workflow:
    min_steps: 4
    max_steps: 7
    required_fields:
      - version
      - category
      - agent
      - difficulty
      - estimated_time
      - skills

# ============================================================================
# VALIDATION MODES - Different Strictness Levels
# ============================================================================

validation_modes:
  # STRICT: Full compliance with all gates
  strict:
    name: "Strict Validation"
    description: "Production-ready, no exceptions"
    multiplier: 1.0
    fail_on_warnings: true
    enabled_gates: [1, 2, 3, 4, 5, 6, 7, 8]
    can_override: false

  # LENIENT: Allow some tolerance for enriched content
  lenient:
    name: "Lenient Validation"
    description: "Allow enriched content and minor overages"
    multiplier: 1.2
    fail_on_warnings: false
    enabled_gates: [1, 2, 3, 4, 5, 6, 7, 8]
    threshold_adjustments:
      file_size:
        max_bytes_multiplier: 1.25  # 1200 * 1.25 = 1500
      description:
        min_length_multiplier: 0.9  # 50 * 0.9 = 45

  # EXPERIMENTAL: Very relaxed for bootstrap phases
  experimental:
    name: "Experimental Validation"
    description: "Relaxed for new features and bootstrapping"
    multiplier: 1.5
    fail_on_warnings: false
    enabled_gates: [1, 2, 3, 4, 5]  # Skip 6-8 (response, efficiency, consistency)
    threshold_adjustments:
      file_size:
        max_bytes: 2000
      description:
        min_length: 30
      mandates:
        minimum_count: 2

# ============================================================================
# COMMIT MESSAGE CONFIGURATION
# ============================================================================

