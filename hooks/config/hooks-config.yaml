# ============================================================================
# PERFORMANCE SETTINGS
# ============================================================================

performance:
  max_validation_time_seconds: 30
  parallel_validation_enabled: true
  max_parallel_gates: 4
  cache_validation_results: true
  cache_ttl_seconds: 3600

# ============================================================================
# LOGGING & REPORTING
# ============================================================================

logging:
  level: WARNING  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: json    # json or text
  output_file: ".agents/hooks/metrics/validation.log"
  max_log_size_mb: 100
  rotation_count: 5

reporting:
  generate_json_report: true
  generate_html_report: false
  report_output_dir: ".agents/hooks/metrics/reports"
  include_metrics: true
  include_suggestions: true

# ============================================================================
# EXPERIMENTAL FEATURES
# ============================================================================

experimental:
  enabled: false
  features:
    - ai_rule_learning
    - plugin_auto_generation
    - rule_optimization
