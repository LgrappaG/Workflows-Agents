# End-to-End Orchestration System Configuration
# Version: 1.0
# Status: Phase 1 - Foundation

metadata:
  version: "1.0"
  framework: ".agents-orchestration"
  description: "End-to-End Orchestration System Configuration"
  last_updated: "2026-04-12"

# Central Orchestrator Settings
orchestrator:
  mode: "centralized"  # vs "distributed" (future)
  heartbeat_interval_seconds: 30
  heartbeat_timeout_seconds: 300
  max_retry_attempts: 3
  error_recovery_strategy: "intelligent_retry"
  learning_enabled: true
  metrics_tracking_enabled: true

# Goal Definitions (supported goals)
goals:
  deploy_game_release:
    name: "Deploy Game Release"
    description: "Deploy production release across all platforms"
    category: "deployment"
    primary_agent: "deploy"
    supporting_agents: ["validation", "sync"]
    timeout_seconds: 1800
    required_context: null

  validate_before_deploy:
    name: "Validate Before Deploy"
    description: "Run comprehensive validation suite"
    category: "validation"
    primary_agent: "validation"
    supporting_agents: []
    timeout_seconds: 600
    required_context: null

  sync_team_collaboration:
    name: "Sync Team Collaboration"
    description: "Sync work from team members"
    category: "synchronization"
    primary_agent: "sync"
    supporting_agents: []
    timeout_seconds: 300
    required_context: null

  learn_and_optimize:
    name: "Learn and Optimize"
    description: "Learn from metrics and suggest optimizations"
    category: "learning"
    primary_agent: "knowledge"
    supporting_agents: []
    timeout_seconds: 120
    required_context: null

# Agent Specifications (Phase 2)
agents:
  deploy:
    display_name: "Deploy Agent"
    specialization: "Release Management"
    tier: 2
    status: "not_implemented"  # Phase 2

  sync:
    display_name: "Sync Agent"
    specialization: "Version Control"
    tier: 2
    status: "not_implemented"  # Phase 2

  validation:
    display_name: "Validation Agent"
    specialization: "Quality Assurance"
    tier: 2
    status: "not_implemented"  # Phase 2

  knowledge:
    display_name: "Knowledge Agent"
    specialization: "Learning & Optimization"
    tier: 2
    status: "not_implemented"  # Phase 2

# Context-Specific Settings
contexts:
  phase_4:
    description: "Phase 4: Strict Production"
    validation_mode: "strict"
    deploy_mode: "manual_approval_required"
    timeout_multiplier: 1.0

  phase_5_enrichment:
    description: "Phase 5: Lenient Development"
    validation_mode: "lenient"
    deploy_mode: "auto_deploy_after_approval"
    timeout_multiplier: 1.5

  ci_strict:
    description: "CI/CD: Strict Environment"
    require_all_checks: true
    fail_fast: true
    timeout_multiplier: 1.0

  local_development:
    description: "Local Development"
    require_all_checks: false
    fail_fast: false
    timeout_multiplier: 2.0
